<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <style>
    /* 深色紫玻璃：對齊頁內浮動藥丸(content.js)的配色，實色不用 backdrop blur */
    :root { color-scheme: dark; }
    body { width: 380px; margin: 0; color: #e5e7eb; background: #14141c;
      font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.1); }
    header h1 { font-size: 14px; margin: 0; flex: 1; }
    #status { font-size: 11px; opacity: .7; }
    #list { max-height: 380px; overflow-y: auto; padding: 6px 0; }
    #list::-webkit-scrollbar { width: 7px; }
    #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }
    .item { margin: 6px 12px; padding: 8px 10px; border-radius: 9px; background: rgba(255,255,255,.05); }
    .item:hover { background: rgba(255,255,255,.09); }
    .url { word-break: break-all; font-size: 11px; opacity: .8; margin-bottom: 6px; }
    .row { display: flex; gap: 6px; }
    button { font: inherit; padding: 5px 11px; border: none; border-radius: 8px; color: #fff; background: rgba(255,255,255,.14); cursor: pointer; }
    button:hover { background: rgba(255,255,255,.26); }
    button.primary { background: linear-gradient(135deg,#6366f1,#8b5cf6); }
    button.primary:hover { filter: brightness(1.1); background: linear-gradient(135deg,#6366f1,#8b5cf6); }
    .warn { margin-top: 6px; font-size: 11px; color: #fcd34d; background: rgba(252,211,77,.1); border-radius: 6px; padding: 4px 7px; }
    .pageCta { margin: 8px 12px; padding: 10px; border-radius: 10px; background: rgba(139,92,246,.14); border: 1px solid rgba(139,92,246,.35); }
    .pageCta .go { width: 100%; padding: 9px; font-size: 13px; font-weight: 700; }
    .pageCta .ctahint { margin-top: 6px; font-size: 11px; color: #fcd34d; }
    details.adv { margin: 0 12px; }
    details.adv > summary { cursor: pointer; padding: 6px 2px; font-size: 12px; opacity: .72; list-style: none; }
    details.adv > summary::-webkit-details-marker { display: none; }
    details.adv[open] > summary { opacity: .95; }
    details.adv .item { margin: 6px 0; }
    .empty { padding: 24px 12px; text-align: center; opacity: .55; }
    footer { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid rgba(255,255,255,.1); }
    footer button { flex: 1; }
    .toast { padding: 4px 12px; font-size: 11px; color: #86efac; min-height: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>M3U8 嗅探</h1>
    <span id="status"></span>
  </header>
  <div id="list"><div class="empty">尚未嗅到 m3u8</div></div>
  <div class="toast" id="toast"></div>
  <footer>
    <button id="page" class="primary" title="整頁交給 yt-dlp 直解（抖音/TikTok 等音畫分離站的正解，自動合軌）">本頁下載</button>
    <button id="refresh">重新整理</button>
    <button id="clear">清空</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
