<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影片下載器</title>
<style>
  :root{
    --bg1:#0f0f17; --bg2:#1a1a28; --card:rgba(255,255,255,.05); --card2:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.12); --txt:#e5e7eb; --dim:#9aa0b0;
    --acc1:#6366f1; --acc2:#8b5cf6; --ok:#22c55e; --err:#ef4444;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--txt);
    font-family:-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
    background:radial-gradient(1200px 600px at 70% -10%,#241f3a,transparent),linear-gradient(160deg,var(--bg1),var(--bg2));
    padding:28px 18px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  .cols{display:flex;gap:18px;align-items:stretch}  /* stretch = 兩欄等高 */
  .col-left{flex:1 1 56%;min-width:0}
  .col-right{flex:1 1 44%;min-width:0;display:flex;flex-direction:column}
  .console-panel{margin-bottom:0;display:flex;flex-direction:column;flex:1;min-height:0}
  /* 桌面:黑色 console 填滿右欄(對齊左欄高度);權重比 base .console 高才蓋得掉 max-height:300 */
  @media(min-width:861px){ .col-right .console{flex:1 1 0;min-height:0;max-height:none} }  /* basis:0 → 內容不撐高欄位,固定高度內部捲動 */
  @media(max-width:860px){ .cols{flex-direction:column} .col-right{display:block} .console-panel{display:block} }
  h1{font-size:20px;margin:0 0 18px;display:flex;align-items:center;gap:10px}
  h1 .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--acc1),var(--acc2));box-shadow:0 0 12px var(--acc2)}
  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px;backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:18px;
  }
  label{display:block;font-size:12px;color:var(--dim);margin:10px 0 5px}
  input,select{
    width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;
    color:var(--txt);padding:10px 12px;font-size:14px;outline:none;transition:border .15s;
  }
  input:focus,select:focus{border-color:var(--acc2)}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  .btns{display:flex;gap:10px;margin-top:14px}
  button{
    border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;
    color:#fff;background:var(--card2);transition:filter .12s,background .12s;
  }
  button:hover{background:rgba(255,255,255,.16)}
  button.primary{background:linear-gradient(135deg,var(--acc1),var(--acc2));flex:1}
  button.primary:hover{filter:brightness(1.12)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}
  .hint b{color:#c4b5fd}
  .ytwarn{background:#f0c14b1a;border:1px solid #f0c14b66;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.6;color:#f0c14b}
  .ytwarn code{background:rgba(0,0,0,.35);padding:2px 6px;border-radius:6px;color:#fcd34d;font-size:12px;user-select:all}
  .ytwarn .x{float:right;cursor:pointer;opacity:.6;padding:0 2px}
  .ytwarn .x:hover{opacity:1}
  .ytwarn .ytup{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px}
  .ytwarn .ytup:hover{filter:brightness(1.1)}
  .ytwarn .ytup:disabled{opacity:.6;cursor:default;filter:none}
  .ytwarn .ytupmsg{font-size:12px;margin-left:8px}
  .subpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .subpick .subopt{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:7px;padding:3px 9px;cursor:pointer}
  .subpick .subopt input{margin:0}
  #qualityBox{display:none}
  .tasks{display:flex;flex-direction:column;gap:10px}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:18px}
  .task{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .task .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .task .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task .pct{font-size:12px;color:var(--dim);white-space:nowrap}
  .bar{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc1),var(--acc2));transition:width .3s}
  .task.done .bar>i{background:var(--ok)}
  .task.err .bar>i{background:var(--err)}
  .task .log{font-size:11px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,monospace}
  .task.err .log{color:#fca5a5;white-space:normal}
  .task .x{cursor:pointer;color:var(--dim);font-size:16px;line-height:1;padding:0 2px;border:none;background:none}
  .task .x:hover{color:#fff}
  .task .hint2{margin-top:8px;font-size:12px;background:#ef44441a;border:1px solid #ef444455;border-radius:8px;padding:8px 10px;color:#fca5a5;line-height:1.5}
  .task .hint2 b{color:#fecaca}
  .console{margin:0;max-height:300px;min-height:120px;overflow:auto;background:#0b0b12;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cbd5e1;white-space:pre-wrap;word-break:break-all}
  .console:empty::before{content:"（待命中…下載開始後這裡會即時顯示 yt-dlp 的輸出）";color:var(--dim)}
  .toast{position:fixed;bottom:18px;right:18px;background:#000;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:.92}
  /* 下載規格小窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100}
  .modal-mask.show{display:flex}
  .modal{width:440px;max-width:92vw;background:linear-gradient(160deg,var(--bg2),#12121c);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .modal .mtitle{font-size:16px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .modal .msrc{font-size:11px;color:var(--dim);word-break:break-all;margin-bottom:6px}
  .mbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .mbtns button{padding:9px 22px}
  .mbtns .primary{flex:0 0 auto}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>影片下載器</h1>
  <div id="ytdlpWarn" class="ytwarn" hidden></div>

  <div class="cols">
  <div class="col-left">
  <div class="panel">
    <label>影片網址（觀看頁，或 userscript 嗅到的 m3u8 網址）</label>
    <input id="url" placeholder="https://… 或 …index.m3u8" autocomplete="off">

    <div class="row">
      <div>
        <label>檔名（留空＝自動抓標題）</label>
        <input id="name" placeholder="自動">
      </div>
      <div>
        <label>Referer（防盜鏈站填觀看頁網址，可留空）</label>
        <input id="referer" placeholder="可留空">
      </div>
    </div>

    <div id="qualityBox">
      <label>畫質</label>
      <select id="quality"></select>
    </div>

    <div id="subBox" style="display:none">
      <label>字幕語言（預設台灣繁中，可自選；全不勾＝不下字幕）</label>
      <div id="subPick" class="subpick"></div>
    </div>

    <label>下載位置（留空＝~/Downloads；Windows 可填 D:\影片 等別的磁碟）</label>
    <input id="dir" placeholder="~/Downloads" autocomplete="off">

    <div class="btns">
      <button id="probeBtn">解析畫質</button>
      <button id="dlBtn" class="primary">⬇ 下載</button>
    </div>
    <div class="hint">
      支援站（YouTube/B站/抖音…）貼觀看頁即可。下載到 <b>~/Downloads</b>（或上方指定的位置）。<br>
      ⚠️ <b>CF + cookie 鎖的站</b>（skyline / javboys 等，403 解不掉）：外部工具拿不到瀏覽器 cookie，請改用 <b>userscript 面板的「下載」鈕</b>（瀏覽器內 session 才能過 Cloudflare）。
    </div>
  </div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <label style="margin:0">下載進度</label>
      <div style="display:flex;gap:8px">
        <button id="clearDone" style="padding:5px 12px;font-size:12px">清除完成</button>
        <button id="clearAll" style="padding:5px 12px;font-size:12px">全部清除</button>
      </div>
    </div>
    <div class="tasks" id="tasks"><div class="empty">尚無下載</div></div>
  </div>
  </div><!-- /col-left -->

  <div class="col-right">
  <div class="panel console-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <label style="margin:0">終端機（即時輸出）</label>
      <button id="conClear" style="padding:5px 12px;font-size:12px">清空</button>
    </div>
    <pre id="console" class="console"></pre>
  </div>
  </div><!-- /col-right -->
  </div><!-- /cols -->
</div>
<div class="toast" id="toast"></div>

<!-- 下載規格小窗（scheme 喚起後跳出，挑畫質/檔名/位置，按下載才真的下）-->
<div class="modal-mask" id="specMask">
  <div class="modal">
    <div class="mtitle"><span class="dot"></span>下載設定</div>
    <div class="msrc" id="spSrc"></div>
    <label>檔名（留空＝自動抓標題）</label>
    <input id="spName" placeholder="自動">
    <label>畫質</label>
    <select id="spQuality"><option value="">最佳畫質（自動）</option></select>
    <div id="spSubWrap" style="display:none">
      <label>字幕語言（預設台灣繁中）</label>
      <div id="spSubPick" class="subpick"></div>
    </div>
    <label>下載位置</label>
    <input id="spDir" placeholder="~/Downloads">
    <div class="mbtns">
      <button id="spCancel">取消</button>
      <button id="spOk" class="primary">⬇ 下載</button>
    </div>
  </div>
</div>

<script>
const VDL_TOKEN = "__VDL_TOKEN__"; // server 注入；/download EventSource 帶上過 CSRF 閘門
const $ = (id) => document.getElementById(id);
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800);}

// 字幕語言選擇:預設勾台灣繁中;該片只有自動字幕時,只列中/英/日自動字幕當選項
function isTW(l){ return /^zh(-?hant|-?tw|-?hk)/i.test(l); }
const SUB_AUTO_SHOW=["zh-Hant","zh-TW","zh-Hant-TW","zh-Hans","zh","en","ja"];
function fillSubPicker(box, subs, autoSubs){
  subs=subs||[]; autoSubs=autoSubs||[];
  const items=[], seen=new Set();
  for(const l of subs){ if(!seen.has(l.toLowerCase())){ items.push({lang:l,auto:false}); seen.add(l.toLowerCase()); } }
  for(const l of SUB_AUTO_SHOW){ if(autoSubs.includes(l) && !seen.has(l.toLowerCase())){ items.push({lang:l,auto:true}); seen.add(l.toLowerCase()); } }
  box.innerHTML="";
  if(!items.length) return false;
  const hasTW=items.some(it=>isTW(it.lang));
  for(const it of items){
    const lab=document.createElement("label"); lab.className="subopt";
    const cb=document.createElement("input"); cb.type="checkbox"; cb.value=it.lang;
    cb.checked = hasTW ? isTW(it.lang) : !it.auto;
    lab.appendChild(cb); lab.appendChild(document.createTextNode(" "+it.lang+(it.auto?"（自動）":"")));
    box.appendChild(lab);
  }
  return true;
}
function getSubLangs(box){
  const all=box.querySelectorAll("input[type=checkbox]");
  if(!all.length) return "";
  const chk=[...box.querySelectorAll("input:checked")].map(c=>c.value);
  return chk.length ? chk.join(",") : "none";
}

// 解析畫質
$("probeBtn").addEventListener("click", async () => {
  const url = $("url").value.trim();
  if(!url){ toast("先貼網址"); return; }
  const btn=$("probeBtn"); btn.disabled=true; btn.textContent="解析中…";
  try{
    const r = await fetch("/probe",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url, referer:$("referer").value.trim()})}).then(r=>r.json());
    if(!r.ok){ toast("解析失敗：" + (r.error||"")); $("qualityBox").style.display="none"; return; }
    if(r.title && !$("name").value.trim()) $("name").value = r.title;
    const sel=$("quality"); sel.innerHTML="";
    const best=document.createElement("option"); best.value=""; best.textContent="最佳畫質（自動）"; sel.appendChild(best);
    for(const f of r.formats){
      const o=document.createElement("option"); o.value=f.id;
      const sz = f.size? " · "+(f.size/1048576).toFixed(0)+"MB":"";
      o.textContent = (f.height? f.height+"p":"?") + " · " + f.ext + (f.note?(" · "+f.note):"") + sz;
      sel.appendChild(o);
    }
    $("qualityBox").style.display = r.formats.length? "block":"none";
    $("subBox").style.display = fillSubPicker($("subPick"), r.subs, r.autoSubs) ? "block":"none";
    toast(r.formats.length? ("找到 "+r.formats.length+" 種畫質"):"此站無多畫質，可直接下載");
  }catch(e){ toast("解析錯誤"); }
  finally{ btn.disabled=false; btn.textContent="解析畫質"; }
});

// 下載
let taskId=0;
// ── 全域即時終端機:所有下載的 yt-dlp 輸出往這裡跑(% 原地跳動)──
let CON=[], conLastProg=false;
function consoleWrite(line){
  if(line==null || line==="") return;
  const isProg=/\[download\]\s+[\d.]+%/.test(line);
  if(isProg && conLastProg && CON.length) CON[CON.length-1]=line; // 進度原地覆蓋
  else CON.push(line);
  conLastProg=isProg;
  if(CON.length>500) CON.splice(0,CON.length-500);
  const c=document.getElementById("console"); if(!c) return;
  const atBottom=c.scrollTop+c.clientHeight>=c.scrollHeight-24;
  c.textContent=CON.join("\n");
  if(atBottom) c.scrollTop=c.scrollHeight; // 貼底才自動捲(使用者往上看時不打擾)
}
document.getElementById("conClear")?.addEventListener("click",()=>{ CON=[]; conLastProg=false; const c=document.getElementById("console"); if(c) c.textContent=""; });
// 錯誤訊息 → 白話原因+解法
function errorHint(txt){
  const t=txt||"";
  const M=[
    [/Unsupported URL/i,"此站 yt-dlp 不支援","改點下方嗅到的 m3u8 分軌下載，別用本頁"],
    [/The page needs to be reloaded/i,"YouTube cookie 造成的錯","已修:更新後重啟 App(youtube 不帶 cookie)"],
    [/Requested format is not available/i,"選的畫質對不上","畫質改「最佳(自動)」再試"],
    [/could not copy.*cookie|cookies? from .*browser|cookie database/i,"瀏覽器把 cookie 資料庫鎖住","關掉該瀏覽器所有視窗再下一次"],
    [/Sign in to confirm|age-restrict|inappropriate/i,"需登入/年齡限制","此片要帳號才能下，外部工具較難"],
    [/Private video|members-only|available to .*member|join this channel/i,"會員/私人影片","沒權限，需訂閱或影片擁有者開放"],
    [/Video unavailable|has been removed|no longer available|not available in your/i,"影片不存在/已下架/地區限制","確認網址，或換管道"],
    [/HTTP Error 403|Access Denied|Forbidden/i,"被伺服器擋(防盜連/權限)","多半缺 Referer/Origin 或 token 過期;巴哈類要邊看邊嗅的即時網址"],
    [/HTTP Error 404/i,"網址失效(404)","影片或連結不存在，重抓網址"],
    [/HTTP Error 429|Too Many Requests/i,"被限流(太頻繁)","等一下再試，或減少同時下載"],
    [/Violation in HTTP messaging rule|curl: ?\(92\)|invalid frame/i,"對方站 HTTP/2 不相容","已自動改 HTTP/1.1 重試;若仍失敗重下一次"],
    [/Unable to.*extract|rehydration/i,"yt-dlp 抽取器過期","按上方「立即更新」更新 yt-dlp 再試"],
  ];
  for(const [re,cause,fix] of M) if(re.test(t)) return {cause,fix};
  if(/error/i.test(t)) return {cause:"未知錯誤",fix:"看下方終端機最後幾行找線索"};
  return null;
}
// 把整份輸出畫進卡片的終端機 + 錯誤原因框
function paintTermHint(el, tail, status){
  const lines=Array.isArray(tail)?tail:[];
  const term=el.querySelector(".term");
  if(term){
    const txt=lines.join("\n");
    if(term.textContent!==txt){
      const atBottom=term.scrollTop+term.clientHeight>=term.scrollHeight-24;
      term.textContent=txt;
      const sum=el.querySelector(".term-wrap>summary");
      if(sum) sum.textContent="終端機（"+lines.length+" 行）";
      if(atBottom) term.scrollTop=term.scrollHeight;
    }
  }
  const hb=el.querySelector(".hint2");
  if(hb){
    if(status==="error"){
      const h=errorHint(lines.join("\n"));
      if(h){ hb.innerHTML="<b>可能原因：</b>"+h.cause+"　<b>解法：</b>"+h.fix; hb.hidden=false; }
      else hb.hidden=true;
    } else hb.hidden=true;
  }
}
$("dlBtn").addEventListener("click", () => {
  const url=$("url").value.trim();
  if(!url){ toast("先貼網址"); return; }
  const fmt = $("qualityBox").style.display!=="none" ? $("quality").value : "";
  const name=$("name").value.trim();
  const referer=$("referer").value.trim();

  const id="t"+(++taskId);
  const tasks=$("tasks");
  const empty=tasks.querySelector(".empty"); if(empty) empty.remove();
  const el=document.createElement("div"); el.className="task"; el.id=id;
  el.innerHTML=`<div class="top"><span class="nm">${(name||url).replace(/</g,"&lt;")}</span>
    <span style="display:flex;align-items:center;gap:8px"><span class="pct">啟動中…</span><button class="x" title="取消/移除">✕</button></span></div>
    <div class="bar"><i></i></div><div class="log"></div>
    <div class="hint2" hidden></div>`;
  tasks.prepend(el);
  const bar=el.querySelector("i"), pct=el.querySelector(".pct"), log=el.querySelector(".log");
  const term=[];

  const qs=new URLSearchParams({url, format:fmt, name, referer, dir:$("dir").value.trim(), subLangs:getSubLangs($("subPick")), token:VDL_TOKEN});
  const es=new EventSource("/download?"+qs.toString());

  // ✕：取消下載並移除卡片（關閉 EventSource → 後端 yt-dlp 被 kill）
  el.querySelector(".x").addEventListener("click", ()=>{ try{es.close();}catch{}; el.remove(); checkEmpty(); });
  let ended=false; // 防 EventSource 斷線自動重連 → 重複 spawn yt-dlp
  es.onmessage=(m)=>{
    const d=JSON.parse(m.data);
    if(d.type==="progress"){ bar.style.width=d.pct+"%"; pct.textContent=d.pct.toFixed(1)+"%"; if(d.line){term.push(d.line); if(term.length>200)term.shift(); consoleWrite(d.line);} }
    else if(d.type==="log"){ log.textContent=d.line; term.push(d.line); if(term.length>200)term.shift(); consoleWrite(d.line); }
    else if(d.type==="done"){ ended=true; bar.style.width="100%"; pct.textContent="完成 ✓"; el.classList.add("done"); consoleWrite("[完成] "+(name||url)); paintTermHint(el,term,"done"); es.close(); toast("下載完成"); }
    else if(d.type==="error"){ ended=true; pct.textContent="錯誤"; el.classList.add("err"); if(d.line){log.textContent=d.line; term.push(d.line); consoleWrite(d.line);} paintTermHint(el,term,"error"); es.close(); }
  };
  es.onerror=()=>{ es.close(); if(!ended){ ended=true; pct.textContent="連線中斷"; el.classList.add("err"); log.textContent="與伺服器連線中斷（下載已中止）"; } };
  toast("開始下載");
});

// 清除鈕（下載中一律保留，不誤清進行中）
function checkEmpty(){ const t=$("tasks"); if(!t.querySelector(".task")) t.innerHTML='<div class="empty">尚無下載</div>'; }
$("clearDone").addEventListener("click", async ()=>{
  // 先等 server 清完再移 DOM（否則 pollJobs 會把卡片長回來閃一下）
  try{ await fetch("/jobs/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"done"})}); }catch{}
  document.querySelectorAll(".task.done").forEach(e=>e.remove());
  checkEmpty();
});
$("clearAll").addEventListener("click", async ()=>{
  // 清完成 + 失敗；下載中(.task 無 done/err class) 保留
  try{ await fetch("/jobs/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"all"})}); }catch{}
  document.querySelectorAll(".task.done,.task.err").forEach(e=>e.remove());
  checkEmpty();
});

// ── 擴充下載（/enqueue）任務：輪詢 /jobs 渲染到同一面板 ──
async function pollJobs(){
  let jobs=[];
  try{ jobs=(await fetch("/jobs").then(r=>r.json())).jobs||[]; }catch{ return; }
  const tasks=$("tasks");
  for(const j of jobs){
    let el=document.getElementById(j.id);
    if(!el){
      const empty=tasks.querySelector(".empty"); if(empty) empty.remove();
      el=document.createElement("div"); el.className="task"; el.id=j.id;
      el.innerHTML=`<div class="top"><span class="nm"></span>
        <span style="display:flex;align-items:center;gap:8px"><span class="pct"></span><span style="font-size:10px;color:var(--acc2);border:1px solid var(--acc2);border-radius:5px;padding:0 4px">擴充</span><button class="x" title="移除">✕</button></span></div>
        <div class="bar"><i></i></div><div class="log"></div>
        <div class="hint2" hidden></div>`;
      tasks.prepend(el);
      el.querySelector(".x").addEventListener("click", async ()=>{
        // 取消/移除擴充任務：通知 server kill + 從清單移除（否則輪詢又長回來）
        try{ await fetch("/jobs/cancel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:j.id})}); }catch{}
        el.remove(); checkEmpty();
      });
    }
    el.querySelector(".nm").textContent=j.name;
    el.querySelector("i").style.width=(j.status==="done"?100:j.pct)+"%";
    el.querySelector(".log").textContent=j.log||"";
    // 新出現的 tail 行推進全域終端機(擴充下載也即時看得到在跑什麼)
    const printed=+(el.dataset.printed||0), tail=j.tail||[];
    if(tail.length>printed){ for(let i=printed;i<tail.length;i++) consoleWrite(tail[i]); el.dataset.printed=tail.length; }
    paintTermHint(el, j.tail, j.status);
    const pct=el.querySelector(".pct");
    el.classList.remove("done","err");
    if(j.status==="done"){ pct.textContent="完成 ✓"; el.classList.add("done"); }
    else if(j.status==="error"){ pct.textContent="錯誤"; el.classList.add("err"); }
    else{ pct.textContent=(j.pct||0).toFixed(1)+"%"; }
  }
}
setInterval(pollJobs, 1200);
pollJobs();

// ── 下載規格小窗（scheme 喚起 → server /pending → 這裡跳窗確認）──
let curPending = null;
const shownPending = new Set();

async function pollPending(){
  if(curPending) return;                       // 一次只處理一筆
  let list=[];
  try{ list=(await fetch("/pending/list").then(r=>r.json())).pending||[]; }catch{ return; }
  const next = list.find(p=>!shownPending.has(p.id));
  if(next){ shownPending.add(next.id); openSpec(next); }
}
function openSpec(item){
  curPending = item;
  $("spSrc").textContent = item.url;
  $("spName").value = item.name || "";
  $("spDir").value = localStorage.getItem("dl_dir") || "~/Downloads";
  const sel=$("spQuality");
  sel.innerHTML='<option value="">解析畫質中…</option>'; sel.disabled=true;
  $("specMask").classList.add("show");
  // 解析畫質（yt-dlp -J，2~5 秒）
  fetch("/probe",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url:item.url, referer:item.referer, browser:item.browser||""})}).then(r=>r.json()).then(r=>{
    sel.disabled=false; sel.innerHTML="";
    const best=document.createElement("option"); best.value=""; best.textContent="最佳畫質（自動）"; sel.appendChild(best);
    if(r.ok){
      if(r.title && !$("spName").value.trim()) $("spName").value=r.title;
      for(const f of r.formats){
        const o=document.createElement("option"); o.value=f.id;
        const sz=f.size? " · "+(f.size/1048576).toFixed(0)+"MB":"";
        o.textContent=(f.height? f.height+"p":"?")+" · "+f.ext+(f.note?(" · "+f.note):"")+sz;
        sel.appendChild(o);
      }
    } else { best.textContent="最佳畫質（此站無法解析畫質）"; }
      $("spSubWrap").style.display = (r.ok && fillSubPicker($("spSubPick"), r.subs, r.autoSubs)) ? "block":"none";
  }).catch(()=>{ sel.disabled=false; sel.innerHTML='<option value="">最佳畫質（自動）</option>'; $("spSubWrap").style.display="none"; });
}
function closeSpec(){ $("specMask").classList.remove("show"); curPending=null; }
async function resolvePending(id){
  try{ await fetch("/pending/resolve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})}); }catch{}
  shownPending.delete(id); // 回收，Set 不無限長
}

$("spCancel").addEventListener("click", async ()=>{ const id=curPending&&curPending.id; closeSpec(); if(id) resolvePending(id); });
$("spOk").addEventListener("click", async ()=>{
  const item=curPending; if(!item) return;
  const dir=$("spDir").value.trim(); localStorage.setItem("dl_dir", dir);
  const body={ url:item.url, referer:item.referer, name:$("spName").value.trim(), format:$("spQuality").value, dir, browser:item.browser||"", subLangs:getSubLangs($("spSubPick")) };
  closeSpec();
  await resolvePending(item.id);
  try{ await fetch("/enqueue",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); toast("開始下載"); }
  catch{ toast("送出失敗"); }
});
setInterval(pollPending, 1000);
pollPending();

// yt-dlp 過期提醒：舊了 TikTok/抖音等站會無聲失效（抽不到/只剩音檔）
async function checkYtdlp(){
  try{
    const h = await fetch("/health").then(r=>r.json());
    const y = h.ytdlp || {};
    if(!y.stale) return;
    const age = y.ageDays!=null ? `${y.ageDays} 天前` : "版本異常";
    const box = $("ytdlpWarn");
    box.innerHTML = `<span class="x" title="關閉">✕</span>⚠ yt-dlp ${y.version||"?"}（${age}）偏舊，TikTok／抖音等站可能失效（抽不到或只剩音檔）。<br><button id="ytUpBtn" class="ytup">⬇ 立即更新</button><span id="ytUpMsg" class="ytupmsg"></span>`;
    box.hidden = false;
    box.querySelector(".x").onclick = ()=>{ box.hidden = true; };
    $("ytUpBtn").onclick = async ()=>{
      const btn=$("ytUpBtn"), msg=$("ytUpMsg");
      btn.disabled=true; btn.textContent="更新中…（約 30 秒，別關視窗）"; msg.textContent="";
      try{
        const r = await fetch("/update-ytdlp",{method:"POST"}).then(r=>r.json());
        const ny = r.ytdlp||{};
        if(r.ok && !ny.stale){
          box.innerHTML = `✅ yt-dlp 已更新到 ${ny.version||"最新"}，可以正常下載了。`;
          setTimeout(()=>{ box.hidden=true; }, 4000);
        }else{
          btn.disabled=false; btn.textContent="⬇ 再試一次";
          msg.textContent=' 更新未完成，可改用終端機：pip install -U --pre "yt-dlp[default]"';
        }
      }catch(e){
        btn.disabled=false; btn.textContent="⬇ 再試一次";
        msg.textContent=" 更新失敗（server 沒回應）";
      }
    };
  }catch{}
}
checkYtdlp();
